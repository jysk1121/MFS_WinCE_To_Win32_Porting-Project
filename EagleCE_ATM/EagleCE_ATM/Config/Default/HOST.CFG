setup_string=AT&FE0+MS=V22B
useDHCP=1
terminal_ip=0.0.0.0
subnet=0.0.0.0
gateway=0.0.0.0
DNS=0.0.0.0

[AMS]
rms_en=1
rms_status_en=0
primary_num=
rms_ip_address=
rms_port=15121
schedule_jnl_en=0
schedule_jnl_cnt=10
